<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeremy 數學偵探 V5.8</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        button:active { transform: scale(0.95); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const Icon = {
            Search: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            Trophy: ({className}) => <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>,
            Check: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>,
            Alert: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Next: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>,
            Copy: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>,
            ArrowRight: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>,
            Clock: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        };

        const QUESTION_TYPES = {
            POSITION: '相對位置與順序',
            LENGTH: '長度與距離比較',
            MEASURE: '自訂單位量度',
            VERTICAL: '直式填空挑戰',
            TIME_SPEED: '誰較快完成功課',
            TIME_DRAW: '互動撥時鐘',
            WORD_PROBLEM: '應用題 (列式計算)'
        };

        const FOODS = ['🍎', '🍩', '🍞', '🧀', '🍌', '🍕', '🧁', '🍦'];

        // --- 子組件：具備完整刻度的時鐘 ---
        const ClockFace = ({ h, m, label, color = "#1e293b", size = 100 }) => {
            const hourAngle = (h * 30) + (m * 0.5);
            const minuteAngle = m * 6;
            const markers = [];
            for (let i = 0; i < 60; i++) {
                const isHour = i % 5 === 0;
                markers.push(
                    <line key={i} x1="100" y1={isHour ? "10" : "15"} x2="100" y2="20" stroke={isHour ? "#334155" : "#94a3b8"} strokeWidth={isHour ? "4" : "2"} transform={`rotate(${i * 6} 100 100)`} />
                );
            }
            return (
                <div className="flex flex-col items-center gap-2">
                    <svg width={size} height={size} viewBox="0 0 200 200" className="drop-shadow-lg">
                        <circle cx="100" cy="100" r="95" fill="white" stroke={color} strokeWidth="6" />
                        {markers}
                        {[...Array(12)].map((_, i) => (
                            <text key={i} x={100 + 70 * Math.sin((i+1)*Math.PI/6)} y={105 - 70 * Math.cos((i+1)*Math.PI/6)} textAnchor="middle" className="font-black text-xl" fill="#1e293b">{i+1}</text>
                        ))}
                        <line x1="100" y1="100" x2={100 + 45 * Math.sin(hourAngle * Math.PI / 180)} y2={100 - 45 * Math.cos(hourAngle * Math.PI / 180)} stroke={color} strokeWidth="12" strokeLinecap="round" />
                        <line x1="100" y1="100" x2={100 + 75 * Math.sin(minuteAngle * Math.PI / 180)} y2={100 - 75 * Math.cos(minuteAngle * Math.PI / 180)} stroke="#ef4444" strokeWidth="6" strokeLinecap="round" />
                        <circle cx="100" cy="100" r="8" fill={color} />
                    </svg>
                    {label && <span className="text-xs font-black text-slate-500 bg-slate-100 px-3 py-1 rounded-full">{label}</span>}
                </div>
            );
        };

        // --- 子組件：直式填空 (支援全隨機四個位置) ---
        const VerticalDisplay = ({ data, subStep, selectedAnswer }) => {
            const isHidden = (pos) => {
                if (subStep === 'first') return pos === data.hide1;
                if (subStep === 'second') return pos === data.hide2;
                return false;
            };

            const getValue = (pos, original) => {
                if (isHidden(pos) && !selectedAnswer) return pos === data.hide1 ? 'a' : 'b';
                return original;
            };

            const getStyle = (pos) => {
                const active = (subStep === 'first' && pos === data.hide1) || (subStep === 'second' && pos === data.hide2);
                if (active && !selectedAnswer) return 'border-amber-400 bg-amber-50 animate-pulse text-amber-600';
                return 'border-slate-200 bg-white text-slate-700';
            };

            return (
                <div className="flex justify-center my-8 font-mono scale-110">
                    <div className="grid grid-cols-[3rem_4rem_4rem] items-center text-5xl leading-none text-slate-700">
                        <div className="col-start-1"></div>
                        <div className={`col-start-2 text-center border-2 border-dashed rounded-xl h-20 flex items-center justify-center transition-all ${getStyle('t1')}`}>{getValue('t1', data.t1)}</div>
                        <div className={`col-start-3 text-center border-2 border-dashed rounded-xl h-20 flex items-center justify-center transition-all ${getStyle('o1')}`}>{getValue('o1', data.o1)}</div>
                        
                        <div className="col-start-1 text-center text-slate-400 font-bold">{data.symbol}</div>
                        <div className={`col-start-2 text-center border-2 border-dashed rounded-xl h-20 flex items-center justify-center transition-all ${getStyle('t2')}`}>{getValue('t2', data.t2)}</div>
                        <div className={`col-start-3 text-center border-2 border-dashed rounded-xl h-20 flex items-center justify-center transition-all ${getStyle('o2')}`}>{getValue('o2', data.o2)}</div>
                        
                        <div className="col-span-3 border-b-8 border-slate-800 my-6 rounded-full"></div>
                        <div className="col-start-1"></div>
                        <div className="col-start-2 text-center font-black">{Math.floor(data.result / 10)}</div>
                        <div className="col-start-3 text-center font-black">{data.result % 10}</div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [stage, setStage] = useState('menu');
            const [score, setScore] = useState(0);
            const [startTime, setStartTime] = useState(0);
            const [endTime, setEndTime] = useState(0);
            const [qIdx, setQIdx] = useState(0);
            const [quizSet, setQuizSet] = useState([]);
            const [subStep, setSubStep] = useState('first');
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [isCorrect, setIsCorrect] = useState(null);
            const [showRationale, setShowRationale] = useState(false);
            const [history, setHistory] = useState([]);
            const [drawHour, setDrawHour] = useState(12);
            const [drawMinute, setDrawMinute] = useState(0);
            const [copyStatus, setCopyStatus] = useState(false);

            const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);

            // --- 核心：生成 15 條絕不重複題目 ---
            const generateQuizSet = () => {
                let questions = [];

                // 1-2. 位置 (食物櫃) - 增加內容變化
                const foods = shuffle([...FOODS]);
                questions.push({
                    type: QUESTION_TYPES.POSITION,
                    text: `看看食物櫃：${foods[1]} 在 ${foods[0]} 的哪一面？`,
                    visual: { type: 'grid', data: [foods.slice(0,4), foods.slice(4,8)] },
                    options: ['左面', '右面', '上面', '下面'],
                    correct: '右面'
                });
                questions.push({
                    type: QUESTION_TYPES.POSITION,
                    text: `在 ${foods[4]} 和 ${foods[7]} 之間共有多少件食物？`,
                    visual: { type: 'grid', data: [foods.slice(0,4), foods.slice(4,8)] },
                    options: ['1', '2', '3'],
                    correct: '2'
                });

                // 3-5. 時間專項 (誰較快完成) - 模擬工作紙，刻度強化
                const timePairs = [
                    { p1: {n:'元元', s:11, e:1, d:2}, p2: {n:'喜喜', s:10, e:1, d:3} },
                    { p1: {n:'小明', s:8, e:10, d:2}, p2: {n:'小玲', s:9, e:10, d:1} },
                    { p1: {n:'家嘉', s:2, e:5, d:3}, p2: {n:'子賢', s:1, e:5, d:4} }
                ];
                timePairs.forEach(pair => {
                    questions.push({
                        type: QUESTION_TYPES.TIME_SPEED,
                        text: `${pair.p1.n} 和 ${pair.p2.n} 各自在做功課，誰較快完成？`,
                        visual: { type: 'speed', p1: pair.p1, p2: pair.p2 },
                        options: [pair.p1.n, pair.p2.n],
                        correct: pair.p1.d < pair.p2.d ? pair.p1.n : pair.p2.n,
                        rationale: `${pair.p1.n}用了 ${pair.p1.d} 小時，${pair.p2.n}用了 ${pair.p2.d} 小時。時間越短代表越快！`
                    });
                });

                // 6-8. 量度 (修正對齊邏輯)
                const measureItems = [
                    {n:'筆袋', c:5, i:'blue'}, {n:'鉛筆', c:3, i:'amber'}, {n:'長尺', c:7, i:'indigo'}
                ];
                measureItems.forEach(item => {
                    questions.push({
                        type: QUESTION_TYPES.MEASURE,
                        text: `圖中的「${item.n}」大約長多少個萬字夾？`,
                        visual: { type: 'measure', count: item.c, color: item.i },
                        options: [ (item.c-1).toString(), item.c.toString(), (item.c+1).toString() ],
                        correct: item.c.toString()
                    });
                });

                // 9-11. 直式填空 (隨機 4 位置)
                const vDatas = [
                    { t1:2, o1:7, t2:1, o2:5, result:42, symbol:'+' },
                    { t1:5, o1:2, t2:2, o2:8, result:24, symbol:'-' },
                    { t1:3, o1:9, t2:1, o2:6, result:55, symbol:'+' }
                ];
                vDatas.forEach(vd => {
                    const pos = ['t1', 'o1', 't2', 'o2'];
                    const hidden = shuffle(pos).slice(0,2);
                    questions.push({
                        type: QUESTION_TYPES.VERTICAL,
                        text: "找出直式謎題中的 [a] 和 [b]。",
                        vertical: { ...vd, hide1: hidden[0], hide2: hidden[1] },
                        correctFirst: vd[hidden[0]].toString(),
                        correctSecond: vd[hidden[1]].toString(),
                        firstOptions: shuffle([vd[hidden[0]].toString(), '4', '8', '0']),
                        secondOptions: shuffle([vd[hidden[1]].toString(), '3', '6', '1'])
                    });
                });

                // 12-13. 撥時鐘
                [6, 9].forEach(h => {
                    questions.push({
                        type: QUESTION_TYPES.TIME_DRAW,
                        text: `偵探任務：請調整時鐘撥出「${h} 時半」。`,
                        visual: { type: 'draw' },
                        targetH: h, targetM: 30,
                        correct: 'draw'
                    });
                });

                // 14-15. 應用題
                questions.push({
                    type: QUESTION_TYPES.WORD_PROBLEM,
                    text: "子言有蘋果 15 個，小華比子言多 6 個。小華有多少個？",
                    correctFirst: "15 + 6", correctSecond: "21",
                    firstOptions: ["15 + 6", "15 - 6"], secondOptions: ["21", "9", "20"]
                });
                questions.push({
                    type: QUESTION_TYPES.WORD_PROBLEM,
                    text: "小明有糖果 20 粒，吃了 7 粒，還餘多少粒？",
                    correctFirst: "20 - 7", correctSecond: "13",
                    firstOptions: ["20 + 7", "20 - 7"], secondOptions: ["13", "27", "12"]
                });

                return shuffle(questions);
            };

            const startGame = () => {
                setQuizSet(generateQuizSet());
                setScore(0); setQIdx(0); setStage('quiz');
                setStartTime(Date.now()); setHistory([]);
                setSubStep('first'); setSelectedAnswer(null); setShowRationale(false);
            };

            const handleAnswer = (ans) => {
                const q = quizSet[qIdx];
                if (q.type === QUESTION_TYPES.VERTICAL || q.type === QUESTION_TYPES.WORD_PROBLEM) {
                    if (subStep === 'first') {
                        const ok = ans === q.correctFirst;
                        setSelectedAnswer(ans);
                        if (ok) setTimeout(() => { setSubStep('second'); setSelectedAnswer(null); }, 600);
                        else finish(false);
                    } else { finish(ans === q.correctSecond); }
                } else if (q.type === QUESTION_TYPES.TIME_DRAW) {
                    if (ans === 'confirm') finish(drawHour === q.targetH && drawMinute === q.targetM);
                } else { finish(ans === q.correct); }
            };

            const finish = (isOk) => {
                setIsCorrect(isOk);
                if (isOk) setScore(s => s + 1);
                setHistory(prev => [...prev, { ...quizSet[qIdx], isOk }]);
                setShowRationale(true);
            };

            const nextQ = () => {
                if (qIdx >= 14) { setEndTime(Date.now()); setStage('result'); }
                else { setQIdx(p => p + 1); setShowRationale(false); setSubStep('first'); setSelectedAnswer(null); setDrawHour(12); setDrawMinute(0); }
            };

            const VisualArea = ({ q }) => {
                if (!q.visual) return null;
                const { type, data, p1, p2, count, color } = q.visual;
                
                if (type === 'grid') return (
                    <div className="grid grid-cols-4 gap-2 bg-amber-50 p-4 rounded-2xl border-4 border-amber-200">
                        {data.flat().map((v, i) => <div key={i} className="aspect-square bg-white rounded-xl flex items-center justify-center text-4xl shadow-sm">{v}</div>)}
                    </div>
                );

                if (type === 'speed') return (
                    <div className="space-y-4">
                        <div className="flex gap-4 p-4 bg-blue-50 rounded-3xl border-2 border-blue-100">
                            <span className="w-12 font-black text-blue-600 flex items-center justify-center">{p1.name}</span>
                            <div className="flex-1 flex justify-around items-center">
                                <ClockFace h={p1.start} m={0} label="開始" size={85} />
                                <Icon.ArrowRight />
                                <ClockFace h={p1.end} m={0} label="結束" size={85} />
                            </div>
                        </div>
                        <div className="flex gap-4 p-4 bg-rose-50 rounded-3xl border-2 border-rose-100">
                            <span className="w-12 font-black text-rose-600 flex items-center justify-center">{p2.name}</span>
                            <div className="flex-1 flex justify-around items-center">
                                <ClockFace h={p2.start} m={0} label="開始" size={85} />
                                <Icon.ArrowRight />
                                <ClockFace h={p2.end} m={0} label="結束" size={85} />
                            </div>
                        </div>
                    </div>
                );

                if (type === 'measure') return (
                    <div className="flex flex-col items-center gap-2 py-6 bg-white rounded-2xl border">
                        <div className="relative w-full px-12 flex flex-col items-center">
                            {/* 物件長度與萬字夾精確對齊 */}
                            <div className={`h-10 rounded-lg flex items-center px-4 border-2 shadow-inner mb-4 transition-all bg-${color}-100 border-${color}-300`} style={{ width: `${count * 40}px` }}>
                                <div className={`w-full h-2 rounded-full bg-${color}-500 opacity-50`}></div>
                            </div>
                            <div className="flex gap-1">
                                {[...Array(count)].map((_, i) => (
                                    <div key={i} className="w-[36px] h-6 border-2 border-slate-300 rounded-full bg-slate-50 flex items-center justify-center">
                                        <div className="w-[20px] h-[2px] bg-slate-200 rounded-full"></div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );

                if (type === 'draw') return (
                    <div className="flex flex-col items-center">
                        <ClockFace h={drawHour} m={drawMinute} size={220} color="#6366f1" />
                        <div className="flex gap-4 mt-4">
                            <button onClick={() => setDrawHour(h=>h===12?1:h+1)} className="bg-slate-800 text-white px-6 py-3 rounded-2xl font-black">+1 時</button>
                            <button onClick={() => setDrawMinute(m=>m===0?30:0)} className="bg-slate-800 text-white px-6 py-3 rounded-2xl font-black">+30 分</button>
                        </div>
                    </div>
                );
                return null;
            };

            const currentQ = quizSet[qIdx];

            return (
                <div className="min-h-screen p-4 flex flex-col items-center">
                    {stage === 'menu' && (
                        <div className="w-full max-w-xl bg-white p-12 rounded-[3rem] shadow-xl text-center border-t-8 border-indigo-600 mt-10">
                            <Icon.Trophy className="text-amber-400 mx-auto mb-6 animate-bounce w-24 h-24" />
                            <h2 className="text-3xl font-black mb-4">Jeremy 數學偵探 V5.8</h2>
                            <p className="text-slate-500 font-bold mb-10 leading-relaxed">
                                已修復時鐘刻度與量度邏輯！<br/>15 題不重複題目，挑戰 100 分。
                            </p>
                            <button onClick={startGame} className="w-full bg-indigo-600 text-white py-6 rounded-3xl text-2xl font-black shadow-xl">開始挑戰</button>
                        </div>
                    )}

                    {stage === 'quiz' && currentQ && (
                        <div className="w-full max-w-xl space-y-6">
                            <header className="flex justify-between items-center bg-white p-4 rounded-3xl shadow-sm border">
                                <div className="font-black text-slate-400 text-sm italic">Case {qIdx + 1} / 15</div>
                                <div className="bg-indigo-600 text-white px-4 py-1 rounded-full font-black text-lg">{score} / 15</div>
                            </header>

                            <div className="bg-white p-8 rounded-[3rem] shadow-md border border-slate-200 relative overflow-hidden">
                                <span className="px-4 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-black mb-6 inline-block uppercase tracking-widest">{currentQ.type}</span>
                                <h3 className="text-2xl font-bold mb-8 text-slate-800 leading-snug">{currentQ.text}</h3>
                                
                                {currentQ.type === QUESTION_TYPES.VERTICAL ? <VerticalDisplay data={currentQ.vertical} subStep={subStep} selectedAnswer={selectedAnswer} /> : <VisualArea q={currentQ} />}

                                <div className="mt-10 grid grid-cols-1 gap-4">
                                    {currentQ.type === QUESTION_TYPES.TIME_DRAW ? (
                                        <button onClick={() => handleAnswer('confirm')} className="w-full bg-slate-900 text-white py-6 rounded-3xl text-xl font-black shadow-xl">確認撥針</button>
                                    ) : (currentQ.type === QUESTION_TYPES.VERTICAL || currentQ.type === QUESTION_TYPES.WORD_PROBLEM) ? (
                                        <div className="grid grid-cols-2 gap-4">
                                            {(subStep === 'first' ? currentQ.firstOptions : currentQ.secondOptions).map((opt, i) => (
                                                <button key={i} onClick={() => handleAnswer(opt)} className="p-6 text-xl font-black rounded-3xl border-4 border-slate-100 bg-slate-50 hover:border-indigo-300">{opt}</button>
                                            ))}
                                        </div>
                                    ) : (
                                        currentQ.options.map((opt, i) => (
                                            <button key={i} onClick={() => handleAnswer(opt)} disabled={showRationale} className={`p-6 text-xl font-black rounded-3xl border-4 text-left ${showRationale && opt === currentQ.correct ? 'border-green-500 bg-green-50' : 'border-slate-100 bg-slate-50'}`}>{opt}</button>
                                        ))
                                    )}
                                </div>
                            </div>

                            {showRationale && (
                                <div className={`p-8 rounded-[2.5rem] shadow-2xl border-l-[12px] animate-in slide-in-from-bottom-8 ${isCorrect ? 'bg-green-50 border-green-500 text-green-800' : 'bg-rose-50 border-rose-500 text-rose-800'}`}>
                                    <div className="flex gap-4 items-center mb-2">
                                        {isCorrect ? <Icon.Check /> : <Icon.Alert />}
                                        <h4 className="font-black text-2xl">{isCorrect ? '破解成功！' : '偵探筆記：'}</h4>
                                    </div>
                                    <p className="text-lg font-bold mb-6 italic opacity-80">{currentQ.rationale || `正確答案是：${currentQ.correct || currentQ.correctSecond}`}</p>
                                    <button onClick={nextQ} className="w-full bg-slate-900 text-white py-5 rounded-2xl font-black text-xl flex items-center justify-center gap-2">下一案 <Icon.Next /></button>
                                </div>
                            )}
                        </div>
                    )}

                    {stage === 'result' && (
                        <div className="w-full max-w-xl bg-white p-12 rounded-[3.5rem] text-center shadow-2xl mt-10 border-b-8 border-indigo-600">
                            <Icon.Trophy className="text-amber-400 mx-auto mb-6 animate-bounce w-24 h-24" />
                            <h2 className="text-4xl font-black mb-8 text-slate-800 tracking-tight">最終搜查報告</h2>
                            
                            <div className="grid grid-cols-2 gap-4 mb-8">
                                <div className="bg-slate-50 p-6 rounded-3xl border border-slate-100">
                                    <p className="text-xs font-black text-slate-400 uppercase tracking-widest mb-1">完成時間</p>
                                    <p className="text-4xl font-black text-slate-800">{Math.floor((endTime - startTime) / 60000)}分 {Math.floor(((endTime - startTime) % 60000) / 1000)}秒</p>
                                </div>
                                <div className="bg-indigo-600 p-6 rounded-3xl text-white shadow-xl shadow-indigo-100">
                                    <p className="text-xs font-black opacity-70 uppercase tracking-widest mb-1">精確得分</p>
                                    <p className="text-5xl font-black">{Math.round((score / 15) * 100)}</p>
                                </div>
                            </div>

                            <button onClick={() => {
                                let r = `【Jeremy 數學偵探 V5.8】\n日期：${new Date().toLocaleString()}\n時間：${Math.floor((endTime-startTime)/1000)}s\n得分：${score}/15\n\n`;
                                history.filter(h=>!h.isOk).forEach((e,i)=>r+=`${i+1}. [${e.type}] ${e.text}\n`);
                                const el = document.createElement('textarea'); el.value = r; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
                                setCopyStatus(true); setTimeout(()=>setCopyStatus(false), 2000);
                            }} className={`w-full mb-6 py-6 rounded-3xl text-xl font-black flex items-center justify-center gap-3 transition-all ${copyStatus ? 'bg-green-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                                {copyStatus ? '已複製到備忘錄' : '複製偵探紀錄'}
                            </button>

                            <button onClick={startGame} className="w-full bg-slate-800 text-white py-8 rounded-3xl text-3xl font-black active:scale-95 transition-all shadow-2xl">重新挑戰</button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
